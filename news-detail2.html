<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新闻2</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        .page-wrapper{position:relative;width:100%;min-height:100vh}
        .news-detail-main{background-color:#ffffff;min-height:100vh;padding-top:120px;padding-bottom:100px}
        .news-article{max-width:900px;margin:0 auto;padding:0 20px}
        .article-title{font-size:32px;color:#c00000;text-align:center;font-weight:bold;margin-bottom:50px;line-height:1.4}
        .article-image-box{width:100%;max-width:800px;margin:0 auto 40px}
        .article-image-box img{width:100%;height:auto;display:block;border-radius:4px}
        .article-content p{font-size:16px;color:#333;line-height:1.9;margin-bottom:20px;text-indent:2em;text-align:justify}
        @media(max-width:768px){.news-detail-main{padding-top:100px;padding-bottom:60px}.article-title{font-size:24px;margin-bottom:30px}.article-image-box{margin-bottom:30px}.article-content p{font-size:15px;line-height:1.8}}
    </style>
</head>
<body>
    <div class="page-wrapper">
        <main class="news-detail-main">
            <article class="news-article">
                <h1 class="article-title">超声振动辅助磨削与磁力抛光的复合加工</h1>
                <div class="article-image-box"><img src="https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?q=80&w=600&auto=format&fit=crop" alt="精密复合加工"></div>
                <div class="article-content">
                    <p>超声振动辅助磨削与磁力抛光的复合加工系统，是近年来精密加工领域的一项重要技术突破。该技术将超声振动与磁力抛光相结合，极大地提升了硬脆材料的加工效率与表面质量。</p>
                    <p>在该复合加工系统中，超声振动使得金刚石砂轮或工件在加工过程中产生高频微小振动，有效降低了磨削力与磨削温度，避免了工件表面的微裂纹产生。而磁力抛光则利用磁场作用下的磁性磨料，对工件表面进行柔性抛光。</p>
                    <p>公司研发团队已与中南大学粉末冶金行业专家李云平教授建立了紧密的产学研合作，共同开发高性能的砂轮结合剂材料和生产工艺。此复合加工技术的成功应用，为玻璃、陶瓷、蓝宝石等材料的加工提供了全新的解决方案。</p>
                </div>
            </article>
        </main>
    </div>
    <script src="hf.js"></script>
